openapi: 3.0.3
info:
  title: Able REST API
  version: 1.0.0
  description: 멀티 DB와 암호화된 설정을 지원하는 REST API.
paths:
  /health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Liveness 확인
      description: 프로세스의 HTTP 응답 가능 여부를 확인한다. DB 연결 상태는 검사하지 않는다.
      responses:
        '200':
          description: 프로세스가 실행 중이다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example: {success: true, request_id: example-request-id, data: {status: ok}}
  /ready:
    get:
      operationId: getReadiness
      tags: [health]
      summary: DB readiness 확인
      description: DB 연결을 확인하고 서비스가 요청을 처리할 준비가 되었는지 반환한다.
      responses:
        '200':
          description: DB에 연결할 수 있다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example: {success: true, request_id: example-request-id, data: {status: ready}}
        '503':
          $ref: '#/components/responses/NotReady'
  /api/v1/users:
    get:
      operationId: listUsers
      tags: [users]
      summary: 사용자 목록 조회
      description: 사용자를 ID 오름차순으로 조회한다. limit은 0 이하 또는 잘못된 정수이면 20, 100 초과이면 100으로 조정한다. offset은 음수 또는 잘못된 정수이면 0으로 조정한다. 빈 페이지는 items가 빈 배열이고 count가 0이다.
      parameters:
        - name: limit
          in: query
          description: 한 페이지에서 반환할 최대 사용자 수. 생략하거나 0 이하 또는 정수가 아니면 20을 사용하고, 100 초과이면 100을 사용한다.
          schema: {type: integer, default: 20}
          example: 20
        - name: offset
          in: query
          description: 건너뛸 사용자 수. 생략하거나 음수 또는 정수가 아니면 0을 사용한다.
          schema: {type: integer, default: 0}
          example: 0
      responses:
        '200':
          description: 사용자 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListEnvelopeResponse'
              example:
                success: true
                request_id: example-request-id
                data:
                  items: [{id: 1, name: Alice, email: alice@example.com, created_at: '2026-04-06T10:00:00Z', updated_at: '2026-04-06T10:00:00Z'}]
                  count: 1
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createUser
      tags: [users]
      summary: 사용자 생성
      description: 이름의 앞뒤 공백을 제거하고 이메일을 소문자로 정규화한 뒤 사용자를 생성한다.
      requestBody:
        description: 생성할 사용자의 이름과 이메일. 두 값 모두 필요하며 null은 허용하지 않는다.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            example: {name: Alice, email: alice@example.com}
      responses:
        '201':
          description: 생성된 사용자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseEnvelope'
              example:
                success: true
                request_id: example-request-id
                data: {id: 1, name: Alice, email: alice@example.com, created_at: '2026-04-06T10:00:00Z', updated_at: '2026-04-06T10:00:00Z'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: 사용자 단건 조회
      description: 양의 정수 ID로 사용자를 조회한다. 숫자가 아닌 ID는 INVALID_ID, 0 이하는 VALIDATION_ERROR를 반환한다.
      parameters:
        - name: id
          in: path
          required: true
          description: 1 이상의 사용자 ID. 숫자가 아니거나 0 이하이면 400을 반환한다.
          schema: {type: integer, format: int64, minimum: 1}
          example: 1
      responses:
        '200':
          description: 사용자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseEnvelope'
              example:
                success: true
                request_id: example-request-id
                data: {id: 1, name: Alice, email: alice@example.com, created_at: '2026-04-06T10:00:00Z', updated_at: '2026-04-06T10:00:00Z'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/mail/send:
    post:
      operationId: sendMail
      tags: [mail]
      summary: 메일 발송
      description: 수신자와 첨부 파일을 검증하고 SMTP 전송을 요청한다. 수신자 주소는 공백 제거 및 소문자 변환 후 중복을 제거한다. 성공 시 실제로 전송을 요청한 고유 수신자 수를 반환한다.
      requestBody:
        description: 메일 수신자, 제목, 본문 및 선택적 첨부 파일. 필수 필드는 null을 허용하지 않는다.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMailRequest'
            example:
              to: [user@example.com]
              cc: [team@example.com]
              subject: Welcome
              body: Hello
              is_html: false
              attachments: [{filename: guide.txt, content_type: text/plain, content_base64: SGVsbG8=}]
      responses:
        '202':
          description: SMTP 전송이 수락되었다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMailResponse'
              example: {success: true, request_id: example-request-id, data: {accepted_recipients: 1}}
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          $ref: '#/components/responses/MailDisabled'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  responses:
    BadRequest:
      description: 'JSON 본문 또는 입력값이 올바르지 않다. error.code는 INVALID_JSON(본문 파싱 실패), INVALID_ID(숫자가 아닌 사용자 ID), VALIDATION_ERROR(값 검증 실패) 중 하나다. 해당 경로에서 발생 가능한 값만 반환한다.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          examples:
            invalidJson:
              summary: JSON 본문 파싱 실패
              value: {success: false, request_id: example-request-id, error: {code: INVALID_JSON, message: JSON 본문이 올바르지 않습니다}}
            invalidId:
              summary: 숫자가 아닌 사용자 ID
              value: {success: false, request_id: example-request-id, error: {code: INVALID_ID, message: id는 숫자여야 합니다}}
            validationError:
              summary: 입력값 검증 실패
              value: {success: false, request_id: example-request-id, error: {code: VALIDATION_ERROR, message: 'invalid input: id는 1 이상이어야 합니다'}}
    UnsupportedMediaType:
      description: 'JSON 이외의 Content-Type을 보냈다. error.code는 UNSUPPORTED_MEDIA_TYPE이며 request_id가 없다.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {success: false, error: {code: UNSUPPORTED_MEDIA_TYPE, message: Content-Type은 application/json 이어야 합니다}}
    NotFound:
      description: '사용자를 찾을 수 없다. error.code는 NOT_FOUND다.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {success: false, request_id: example-request-id, error: {code: NOT_FOUND, message: 사용자를 찾을 수 없습니다}}
    NotReady:
      description: 'DB 연결이 준비되지 않았다. error.code는 DB_NOT_READY다.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {success: false, request_id: example-request-id, error: {code: DB_NOT_READY, message: DB 연결이 준비되지 않았습니다}}
    MailDisabled:
      description: '메일 발송 기능이 비활성화되어 있다. error.code는 MAIL_DISABLED다.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {success: false, request_id: example-request-id, error: {code: MAIL_DISABLED, message: 메일 발송 기능이 비활성화되어 있습니다}}
    InternalError:
      description: '내부 오류. error.code는 INTERNAL_ERROR다.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {success: false, request_id: example-request-id, error: {code: INTERNAL_ERROR, message: 요청 처리 중 오류가 발생했습니다}}
  schemas:
    SuccessEnvelope:
      type: object
      description: 성공 응답의 공통 속성. 각 응답 schema가 필수 data의 구체적인 형식을 정의한다.
      required: [success]
      properties:
        success: {type: boolean, enum: [true], example: true}
        request_id: {type: string, minLength: 1, description: 요청별 식별자. 값이 비어 있으면 속성을 생략하며 null은 반환하지 않는다., example: example-request-id}
    ErrorResponse:
      type: object
      description: 실패 응답의 공통 구조. request_id는 JSON Content-Type 검증이 먼저 실패한 415 응답에 없다.
      required: [success, error]
      properties:
        success: {type: boolean, enum: [false], example: false}
        request_id: {type: string, minLength: 1, description: 미지원 Content-Type의 415 응답에는 없으며 null은 반환하지 않는다., example: example-request-id}
        error: {$ref: '#/components/schemas/ErrorDetail'}
    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: 기계적으로 판별할 오류 코드. 각 응답의 description에서 해당 status에 가능한 코드를 확인한다.
          enum: [INVALID_JSON, INVALID_ID, VALIDATION_ERROR, UNSUPPORTED_MEDIA_TYPE, NOT_FOUND, DB_NOT_READY, MAIL_DISABLED, INTERNAL_ERROR]
          example: VALIDATION_ERROR
        message: {type: string, minLength: 1, description: 사람이 읽을 수 있는 오류 설명. 문구는 상황에 따라 달라질 수 있다., example: 잘못된 요청입니다}
    HealthData:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [ok, ready], description: '/health는 ok, /ready는 ready를 반환한다.', example: ok}
    HealthResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data: {$ref: '#/components/schemas/HealthData'}
    CreateUserRequest:
      type: object
      description: 필수 입력은 문자열이며 null을 허용하지 않는다. 정의하지 않은 속성은 무시한다.
      required: [name, email]
      properties:
        name: {type: string, minLength: 1, description: 사용자 이름. 앞뒤 공백을 제거한 뒤 빈 값이면 VALIDATION_ERROR를 반환한다., example: Alice}
        email: {type: string, minLength: 3, description: 사용자 이메일. 앞뒤 공백을 제거하고 소문자로 변환한다. 비어 있거나 @ 문자가 없으면 VALIDATION_ERROR를 반환한다. 완전한 이메일 형식 검증은 하지 않는다., example: alice@example.com}
    User:
      type: object
      required: [id, name, email, created_at, updated_at]
      properties:
        id: {type: integer, format: int64, minimum: 1, description: 생성된 사용자의 고유 ID., example: 1}
        name: {type: string, description: 저장된 사용자 이름., example: Alice}
        email: {type: string, description: 저장된 사용자 이메일., example: alice@example.com}
        created_at: {type: string, format: date-time, description: 사용자 생성 시각., example: '2026-04-06T10:00:00Z'}
        updated_at: {type: string, format: date-time, description: 사용자 최종 수정 시각., example: '2026-04-06T10:00:00Z'}
    UserResponseEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data: {$ref: '#/components/schemas/User'}
    UserListData:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          description: 이번 페이지의 사용자 목록. 결과가 없으면 빈 배열이다.
          items: {$ref: '#/components/schemas/User'}
        count: {type: integer, minimum: 0, description: 반환된 items의 개수., example: 1}
    UserListEnvelopeResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data: {$ref: '#/components/schemas/UserListData'}
    SendMailAttachmentRequest:
      type: object
      required: [filename, content_base64]
      properties:
        filename: {type: string, minLength: 1, description: 첨부 파일 이름. 앞뒤 공백과 경로 부분을 제거하며 빈 이름은 거부한다., example: guide.txt}
        content_type: {type: string, description: 첨부 파일 MIME 유형. 생략하거나 공백이면 application/octet-stream을 사용한다. null은 문자열이 아니므로 보내지 않는다., example: text/plain}
        content_base64: {type: string, format: byte, description: 표준 Base64로 인코딩한 파일 내용. 디코딩한 내용이 비어 있으면 400을 반환한다. 파일당 최대 5 MiB., example: SGVsbG8gd29ybGQ=}
    SendMailRequest:
      type: object
      description: 필수 값은 null을 허용하지 않는다. 선택 필드를 생략하면 빈 수신자 목록, 일반 텍스트 본문 또는 첨부 파일 없음으로 처리한다.
      required: [to, subject, body]
      properties:
        to:
          type: array
          minItems: 1
          description: 필수 주 수신자 주소. 공백과 중복을 제거한 뒤 유효한 주소가 최소 하나 필요하다.
          items: {type: string}
          example: [user@example.com]
        cc:
          type: array
          description: 선택 참조 수신자. 생략하면 없다. to 및 cc 내 중복은 전송 시 제거한다.
          items: {type: string}
          example: [team@example.com]
        bcc:
          type: array
          description: 선택 숨은 참조 수신자. 생략하면 없다. 다른 수신자와 중복된 주소는 전송 시 제거한다.
          items: {type: string}
          example: [audit@example.com]
        subject: {type: string, minLength: 1, description: 제목. 앞뒤 공백을 제거하며 빈 값은 거부한다., example: Welcome}
        body: {type: string, minLength: 1, description: 본문. 앞뒤 공백을 제거하며 빈 값은 거부한다., example: Hello}
        is_html: {type: boolean, description: true면 HTML 본문으로 전송한다. 생략하면 false다., example: false}
        attachments:
          type: array
          maxItems: 5
          description: 선택 첨부 파일. 최대 5개이며 디코딩된 크기 합계는 최대 20 MiB다. 생략하면 첨부하지 않는다.
          items: {$ref: '#/components/schemas/SendMailAttachmentRequest'}
    SendMailResponseData:
      type: object
      required: [accepted_recipients]
      properties:
        accepted_recipients: {type: integer, minimum: 1, description: '중복 제거 후 SMTP 전송에 사용한 to, cc, bcc 주소의 합계.', example: 1}
    SendMailResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data: {$ref: '#/components/schemas/SendMailResponseData'}
