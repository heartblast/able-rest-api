openapi: 3.0.3
info:
  title: Able REST API
  version: 1.0.0
  description: 멀티 DB와 암호화된 설정을 지원하는 REST API.
paths:
  /health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Liveness 확인
      responses:
        '200':
          description: 프로세스가 실행 중이다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example: {success: true, request_id: example-request-id, data: {status: ok}}
  /ready:
    get:
      operationId: getReadiness
      tags: [health]
      summary: DB readiness 확인
      responses:
        '200':
          description: DB에 연결할 수 있다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example: {success: true, request_id: example-request-id, data: {status: ready}}
        '503':
          $ref: '#/components/responses/NotReady'
  /api/v1/users:
    get:
      operationId: listUsers
      tags: [users]
      summary: 사용자 목록 조회
      description: limit은 0 이하 또는 잘못된 정수이면 20, 100 초과이면 100으로 조정한다. offset은 음수 또는 잘못된 정수이면 0으로 조정한다.
      parameters:
        - name: limit
          in: query
          description: 조회 건수. 생략하면 20.
          schema: {type: integer, default: 20}
          example: 20
        - name: offset
          in: query
          description: 오프셋. 생략하면 0.
          schema: {type: integer, default: 0}
          example: 0
      responses:
        '200':
          description: 사용자 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListEnvelopeResponse'
              example:
                success: true
                request_id: example-request-id
                data:
                  items: [{id: 1, name: Alice, email: alice@example.com, created_at: '2026-04-06T10:00:00Z', updated_at: '2026-04-06T10:00:00Z'}]
                  count: 1
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createUser
      tags: [users]
      summary: 사용자 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            example: {name: Alice, email: alice@example.com}
      responses:
        '201':
          description: 생성된 사용자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseEnvelope'
              example:
                success: true
                request_id: example-request-id
                data: {id: 1, name: Alice, email: alice@example.com, created_at: '2026-04-06T10:00:00Z', updated_at: '2026-04-06T10:00:00Z'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: 사용자 단건 조회
      parameters:
        - name: id
          in: path
          required: true
          description: 1 이상의 사용자 ID. 숫자가 아니거나 0 이하이면 400을 반환한다.
          schema: {type: integer, format: int64, minimum: 1}
          example: 1
      responses:
        '200':
          description: 사용자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseEnvelope'
              example:
                success: true
                request_id: example-request-id
                data: {id: 1, name: Alice, email: alice@example.com, created_at: '2026-04-06T10:00:00Z', updated_at: '2026-04-06T10:00:00Z'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/mail/send:
    post:
      operationId: sendMail
      tags: [mail]
      summary: 메일 발송
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMailRequest'
            example: {to: [user@example.com], subject: Welcome, body: Hello, is_html: false}
      responses:
        '202':
          description: SMTP 전송이 수락되었다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMailResponse'
              example: {success: true, request_id: example-request-id, data: {accepted_recipients: 1}}
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          $ref: '#/components/responses/MailDisabled'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  responses:
    BadRequest:
      description: JSON 본문 또는 입력값이 올바르지 않다.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {success: false, request_id: example-request-id, error: {code: VALIDATION_ERROR, message: 잘못된 요청입니다}}
    UnsupportedMediaType:
      description: JSON 이외의 Content-Type을 보냈다. 이 응답에는 request_id가 없다.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {success: false, error: {code: UNSUPPORTED_MEDIA_TYPE, message: Content-Type은 application/json 이어야 합니다}}
    NotFound:
      description: 사용자를 찾을 수 없다.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {success: false, request_id: example-request-id, error: {code: NOT_FOUND, message: 사용자를 찾을 수 없습니다}}
    NotReady:
      description: DB 연결이 준비되지 않았다.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {success: false, request_id: example-request-id, error: {code: DB_NOT_READY, message: DB 연결이 준비되지 않았습니다}}
    MailDisabled:
      description: 메일 발송 기능이 비활성화되어 있다.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {success: false, request_id: example-request-id, error: {code: MAIL_DISABLED, message: 메일 발송 기능이 비활성화되어 있습니다}}
    InternalError:
      description: 내부 오류
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {success: false, request_id: example-request-id, error: {code: INTERNAL_ERROR, message: 요청 처리 중 오류가 발생했습니다}}
  schemas:
    SuccessEnvelope:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true], example: true}
        request_id: {type: string, description: 요청별 식별자. 값이 비어 있으면 생략된다., example: example-request-id}
        data: {type: object}
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success: {type: boolean, enum: [false], example: false}
        request_id: {type: string, description: 미지원 Content-Type 응답에는 없다., example: example-request-id}
        error: {$ref: '#/components/schemas/ErrorDetail'}
    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code: {type: string, example: VALIDATION_ERROR}
        message: {type: string, example: 잘못된 요청입니다}
    HealthData:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [ok, ready], example: ok}
    HealthResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/HealthData'}
    CreateUserRequest:
      type: object
      required: [name, email]
      properties:
        name: {type: string, minLength: 1, description: 공백을 제거한 뒤 빈 값이면 400., example: Alice}
        email: {type: string, minLength: 3, description: 공백을 제거하고 소문자로 변환한다. @ 문자가 없으면 400., example: alice@example.com}
    User:
      type: object
      required: [id, name, email, created_at, updated_at]
      properties:
        id: {type: integer, format: int64, example: 1}
        name: {type: string, example: Alice}
        email: {type: string, example: alice@example.com}
        created_at: {type: string, format: date-time, example: '2026-04-06T10:00:00Z'}
        updated_at: {type: string, format: date-time, example: '2026-04-06T10:00:00Z'}
    UserResponseEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/User'}
    UserListData:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/User'}
        count: {type: integer, description: 반환된 items의 개수., example: 1}
    UserListEnvelopeResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/UserListData'}
    SendMailAttachmentRequest:
      type: object
      required: [filename, content_base64]
      properties:
        filename: {type: string, minLength: 1, example: guide.txt}
        content_type: {type: string, description: 생략하면 application/octet-stream., example: text/plain}
        content_base64: {type: string, format: byte, description: 디코딩한 내용이 비어 있으면 400. 파일당 최대 5 MiB., example: SGVsbG8gd29ybGQ=}
    SendMailRequest:
      type: object
      required: [to, subject, body]
      properties:
        to:
          type: array
          minItems: 1
          items: {type: string}
          example: [user@example.com]
        cc:
          type: array
          items: {type: string}
          example: [team@example.com]
        bcc:
          type: array
          items: {type: string}
          example: [audit@example.com]
        subject: {type: string, minLength: 1, example: Welcome}
        body: {type: string, minLength: 1, example: Hello}
        is_html: {type: boolean, example: false}
        attachments:
          type: array
          maxItems: 5
          description: 첨부 파일의 디코딩된 크기 합계는 최대 20 MiB.
          items: {$ref: '#/components/schemas/SendMailAttachmentRequest'}
    SendMailResponseData:
      type: object
      required: [accepted_recipients]
      properties:
        accepted_recipients: {type: integer, example: 1}
    SendMailResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/SendMailResponseData'}
